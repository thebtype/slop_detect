<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Detect Settings</title>
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --accent: #0a66c2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --accent: #60a5fa; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    label:first-child { margin-top: 0; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
    select, input[type=text], input[type=password], input[type=number] {
      width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg); color: var(--text); font: inherit;
    }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .row label { margin: 0; font-weight: 400; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    #status { margin-left: 10px; color: var(--muted); }
    .consent { align-items: flex-start; font-size: 12px; color: var(--muted); }
    .consent input { margin-top: 3px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Slop Detect</h1>
  <p class="sub">Labels likely AI-generated posts in your LinkedIn feed.</p>

  <section>
    <div class="row"><input type="checkbox" id="enabled"><label for="enabled">Enabled</label></div>

    <label for="mode">Detection mode</label>
    <select id="mode">
      <option value="heuristic">Local rules only (free, instant, private)</option>
      <option value="hybrid">Hybrid: ask Claude only about suspicious posts</option>
      <option value="claude">Claude for every post</option>
    </select>

    <label for="threshold">Slop threshold <span class="hint">(0–100, higher = stricter)</span></label>
    <input type="number" id="threshold" min="1" max="100">

    <label for="action">What to do with slop</label>
    <select id="action">
      <option value="label">Just label it</option>
      <option value="dim">Label and dim it</option>
    </select>

    <div class="row"><input type="checkbox" id="autoCollapse"><label for="autoCollapse">Auto-collapse near-certain slop</label></div>
    <label for="collapseAt">Auto-collapse at score <span class="hint">(only posts at or above this are hidden; the rest stay open with a Collapse button)</span></label>
    <input type="number" id="collapseAt" min="1" max="100">

    <div class="row"><input type="checkbox" id="stamp"><label for="stamp">Big animated stamp across slop posts</label></div>
    <div class="row"><input type="checkbox" id="showHuman"><label for="showHuman">Also label posts that look human</label></div>
  </section>

  <section>
    <label for="apiKey">Anthropic API key <span class="hint">(only needed for Hybrid / Claude modes; stored on this device only)</span></label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">

    <div class="row consent"><input type="checkbox" id="claudeConsent"><label for="claudeConsent">I understand that in Hybrid and Claude modes, the text of LinkedIn posts is sent to Anthropic's API using my key. In the default local mode nothing leaves my browser. <a href="https://github.com/thebtype/slop_detect/blob/HEAD/PRIVACY.md" target="_blank" rel="noopener">Privacy policy</a></label></div>

    <label for="model">Claude model</label>
    <select id="model">
      <option value="claude-opus-5">Claude Opus 5 (most accurate)</option>
      <option value="claude-sonnet-5">Claude Sonnet 5 (cheaper)</option>
      <option value="claude-haiku-4-5">Claude Haiku 4.5 (cheapest, fastest)</option>
    </select>

    <label for="hybridGate">Hybrid gate <span class="hint">(local score needed before asking Claude)</span></label>
    <input type="number" id="hybridGate" min="0" max="100">
  </section>

  <button id="save">Save</button><span id="status"></span>
</main>
<script src="options.js"></script>
</body>
</html>
